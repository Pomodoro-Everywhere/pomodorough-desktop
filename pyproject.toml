[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodorough-linux"
version = "0.2.2"
description = "Cross-platform, local-first Pomodoro timer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "platformdirs>=4.3,<5",
    "PySide6-Essentials>=6.8,<7",
    "windows-curses>=2.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
iroh = [
    "iroh==1.1.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.urls]
Homepage = "https://github.com/Pomodoro-Everywhere/pomodorough-desktop"
Repository = "https://github.com/Pomodoro-Everywhere/pomodorough-desktop"
Issues = "https://github.com/Pomodoro-Everywhere/pomodorough-desktop/issues"

[project.scripts]
pomodorough = "pomodorough.app:main"
pomodorough-cli = "pomodorough.cli:main"
pomodorough-tui = "pomodorough.tui:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pomodorough = ["resources/*.json", "resources/*.svg"]
