name: Build Flatpak release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag used to name artifact
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: flatpak-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release version
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: Pomodorough-${{ steps.release.outputs.version }}-x86_64.flatpak
          manifest-path: deploy/flatpak/me.egigoka.Pomodorough.yml
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-flatpak
          path: Pomodorough-${{ steps.release.outputs.version }}-x86_64.flatpak
          if-no-files-found: error
          overwrite: true
          retention-days: 7
