name: Build Flatpak release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      COMPROMISED_GOOGLE_CLIENT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag used to name artifact
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: flatpak-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read release version
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: Pomodorough-${{ steps.release.outputs.version }}-x86_64.flatpak
          manifest-path: deploy/flatpak/me.egigoka.Pomodorough.yml
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Verify shared core in Flatpak bundle
        shell: bash
        env:
          COMPROMISED_GOOGLE_CLIENT_SECRET: ${{ secrets.COMPROMISED_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$COMPROMISED_GOOGLE_CLIENT_SECRET"
          bundle="Pomodorough-${{ steps.release.outputs.version }}-x86_64.flatpak"
          flatpak install --user --noninteractive "$bundle"
          flatpak run --user --command=python3 me.egigoka.Pomodorough -c \
            'from pomodorough.shared_core import SharedCore; raise SystemExit(0 if SharedCore().dispatch("core.version", {}).get("schemaVersion") == 1 else "invalid packaged shared core")'
          expected_client_id="$(python3 -c 'import json; print(json.load(open("src/pomodorough/resources/oauth-client.json"))["installed"]["client_id"])')"
          flatpak run --user \
            --env=POMODOROUGH_EXPECTED_OAUTH_CLIENT_ID="$expected_client_id" \
            --env=COMPROMISED_GOOGLE_CLIENT_SECRET="$COMPROMISED_GOOGLE_CLIENT_SECRET" \
            --command=python3 \
            me.egigoka.Pomodorough \
            -c 'import json, os; from importlib.resources import files; document=json.loads(files("pomodorough").joinpath("resources/oauth-client.json").read_text(encoding="utf-8")); config=document.get("installed") or document; valid=config.get("client_id") == os.environ["POMODOROUGH_EXPECTED_OAUTH_CLIENT_ID"] and not config.get("client_secret"); raise SystemExit(0 if valid else "invalid packaged OAuth resource")'
          flatpak run --user \
            --env=COMPROMISED_GOOGLE_CLIENT_SECRET="$COMPROMISED_GOOGLE_CLIENT_SECRET" \
            --command=python3 \
            me.egigoka.Pomodorough \
            -c 'import os; from pathlib import Path; secret=os.environ["COMPROMISED_GOOGLE_CLIENT_SECRET"].encode(); found=any(secret in path.read_bytes() for path in Path("/app").rglob("*") if path.is_file() and not path.is_symlink()); raise SystemExit("compromised secret found in unpacked Flatpak" if found else 0)'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-flatpak
          path: Pomodorough-${{ steps.release.outputs.version }}-x86_64.flatpak
          if-no-files-found: error
          overwrite: true
          retention-days: 7
