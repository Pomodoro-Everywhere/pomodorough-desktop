name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "$RELEASE_TAG" HEAD
          unexpected_changes="$(git diff --name-only "$RELEASE_TAG" HEAD -- . \
            ':(exclude).github/**' \
            ':(exclude).gitattributes' \
            ':(exclude)tests/**')"
          if [[ -n "$unexpected_changes" ]]; then
            echo "Manual release source differs from $RELEASE_TAG outside CI and test files:" >&2
            printf '%s\n' "$unexpected_changes" >&2
            exit 1
          fi

      - name: Validate tag and version metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* ]] || [[ ! "$tag_version" =~ $semver_pattern ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(python -c 'import ast; print(ast.literal_eval(open("src/pomodorough/__init__.py").read().split("=", 1)[1].strip()))')"
          flake_version="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";.*/\1/p' flake.nix)"
          lock_version="$(python -c 'import tomllib; data=tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in data["package"] if p["name"] == "pomodorough-linux"))')"
          metainfo_version="$(sed -nE 's/^[[:space:]]*<release version="([^"]+)".*/\1/p' deploy/flatpak/me.egigoka.Pomodorough.metainfo.xml | head -n 1)"
          for source_version in "$package_version" "$module_version" "$flake_version" "$lock_version" "$metainfo_version"; do
            if [[ "$source_version" != "$tag_version" ]]; then
              echo "Tag $RELEASE_TAG does not match source version $source_version" >&2
              exit 1
            fi
          done
          grep -Fq "releases/download/v${tag_version}/pomodorough_linux-${tag_version}.tar.gz" README.md
          grep -Fq "github:Pomodoro-Everywhere/pomodorough-desktop/v${tag_version}" README.md
          grep -Fq "releases/download/v${tag_version}/Pomodorough-${tag_version}-x86_64.flatpak" README.md

          release_state="missing"
          release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || printf missing)"
          if [[ "$release_state" != "published" ]]; then
            previous_versions=()
            while IFS= read -r candidate; do
              [[ "$candidate" == "$RELEASE_TAG" ]] && continue
              candidate_version="${candidate#v}"
              if [[ ! "$candidate_version" =~ $semver_pattern ]]; then
                echo "Existing release tag $candidate is not strict SemVer" >&2
                exit 1
              fi
              previous_versions+=("$candidate_version")
            done < <(git tag --list 'v*')
            if (( ${#previous_versions[@]} > 0 )); then
              highest_previous="$(printf '%s\n' "${previous_versions[@]}" | sort -V | tail -n 1)"
              highest="$(printf '%s\n' "$highest_previous" "$tag_version" | sort -V | tail -n 1)"
              if [[ "$highest" != "$tag_version" ]] || [[ "$highest_previous" == "$tag_version" ]]; then
                echo "Release $tag_version must exceed existing $highest_previous" >&2
                exit 1
              fi
            fi
          fi

  ci:
    name: Required CI
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: Build Python package
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Read package version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source and wheel distributions reproducibly
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          normalize_sdist() {
            local archive stage top
            local -a entries
            archive="$(printf '%s\n' dist/*.tar.gz)"
            stage="$(mktemp -d)"
            tar -xzf "$archive" -C "$stage"
            entries=("$stage"/*)
            if (( ${#entries[@]} != 1 )) || [[ ! -d "${entries[0]}" ]]; then
              echo "sdist must contain exactly one top-level directory" >&2
              return 1
            fi
            top="$(basename "${entries[0]}")"
            tar \
              --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$stage" \
              -cf - \
              "$top" | gzip -n > "$archive.normalized"
            mv "$archive.normalized" "$archive"
            rm -rf "$stage"
          }
          python -m build
          normalize_sdist
          first_build="$RUNNER_TEMP/first-python-build"
          mkdir -p "$first_build"
          cp dist/* "$first_build/"
          rm -rf dist
          python -m build
          normalize_sdist
          for artifact in dist/*; do
            cmp "$first_build/$(basename "$artifact")" "$artifact"
          done

      - name: Verify distributions
        run: |
          test -f "dist/pomodorough_linux-${{ steps.version.outputs.version }}.tar.gz"
          test -f "dist/pomodorough_linux-${{ steps.version.outputs.version }}-py3-none-any.whl"
          python -m twine check dist/*

      - name: Install and test wheel
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python -m pip check
          QT_QPA_PLATFORM=offscreen .release-wheel/bin/python -m unittest discover -s tests -v
          POMODOROUGH_SCREENSHOT="$PWD/.release-wheel-smoke.png" \
            QT_QPA_PLATFORM=offscreen \
            timeout 30s .release-wheel/bin/pomodorough \
            2>.release-wheel-smoke.stderr
          test -s .release-wheel-smoke.png
          if grep -q 'Traceback (most recent call last)' .release-wheel-smoke.stderr; then
            cat .release-wheel-smoke.stderr
            exit 1
          fi

      - name: Install and test source distribution
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python -m pip check
          QT_QPA_PLATFORM=offscreen .release-sdist/bin/python -m unittest discover -s tests -v
          POMODOROUGH_SCREENSHOT="$PWD/.release-sdist-smoke.png" \
            QT_QPA_PLATFORM=offscreen \
            timeout 30s .release-sdist/bin/pomodorough \
            2>.release-sdist-smoke.stderr
          test -s .release-sdist-smoke.png
          if grep -q 'Traceback (most recent call last)' .release-sdist-smoke.stderr; then
            cat .release-sdist-smoke.stderr
            exit 1
          fi

      - name: Upload Python package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  flatpak:
    name: Build Flatpak
    needs: package
    permissions:
      contents: read
    uses: ./.github/workflows/build-flatpak.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  windows:
    name: Build Windows executable
    needs: package
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  release:
    name: Create GitHub release
    needs:
      - package
      - flatpak
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source for SBOM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Export SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/pomodorough-desktop.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.flatpak
            dist/*.exe
            dist/*.spdx.json

      - name: Verify artifacts and create checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -f "dist/pomodorough_linux-${version}.tar.gz"
          test -f "dist/pomodorough_linux-${version}-py3-none-any.whl"
          test -f "dist/Pomodorough-${version}-x86_64.flatpak"
          test -f "dist/Pomodorough-${version}-windows-x86_64.exe"
          test -f "dist/pomodorough-desktop.spdx.json"
          (
            cd dist
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_assets=(
            "Pomodorough-${version}-windows-x86_64.exe"
            "Pomodorough-${version}-x86_64.flatpak"
            "pomodorough_linux-${version}-py3-none-any.whl"
            "pomodorough_linux-${version}.tar.gz"
            "pomodorough-desktop.spdx.json"
          )
          expected_release_assets=("${expected_assets[@]}" "SHA256SUMS.txt")

          verify_release_assets() {
            published_dir="$(mktemp -d "$RUNNER_TEMP/published-release.XXXXXX")"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$published_dir"
            printf '%s\n' "${expected_release_assets[@]}" | sort > "$RUNNER_TEMP/expected-assets.txt"
            find "$published_dir" -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/actual-assets.txt"
            cmp "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"
            (
              cd "$published_dir"
              sha256sum --check SHA256SUMS.txt
              printf '%s\n' "${expected_assets[@]}" | sort > expected-manifest-assets.txt
              awk '{print $2}' SHA256SUMS.txt | sed 's|^\*||' | sort > actual-manifest-assets.txt
              cmp expected-manifest-assets.txt actual-manifest-assets.txt
              for asset in "${expected_assets[@]}"; do
                gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
              done
              gh attestation verify SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
            )
          }

          release_state="missing"
          if release_state="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null)"; then
            if [[ "$release_state" == "published" ]]; then
              verify_release_assets
              echo "Release $RELEASE_TAG is already published"
              exit 0
            fi
          else
            release_state="missing"
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n' \
              'Release assets include Python packages, Flatpak bundle, and standalone Windows executable.' \
              'Windows executable signing is intentionally excluded; verify SHA256SUMS.txt and GitHub attestations before use.' \
              ''
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              --jq .body
          } > "$notes_file"

          if [[ "$release_state" == "missing" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Pomodorough Desktop $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          done < <(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY"
          verify_release_assets
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pomodorough Desktop $RELEASE_TAG" \
            --notes-file "$notes_file" \
            --draft=false

  homebrew:
    name: Update Homebrew
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
