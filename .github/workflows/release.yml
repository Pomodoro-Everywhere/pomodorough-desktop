name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Required CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: Build and publish Python package
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Verify tag version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distributions
        run: |
          test -f "dist/pomodorough_linux-${{ steps.version.outputs.version }}.tar.gz"
          test -f "dist/pomodorough_linux-${{ steps.version.outputs.version }}-py3-none-any.whl"
          python -m twine check dist/*

      - name: Install and test wheel
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python -m pip check
          QT_QPA_PLATFORM=offscreen .release-wheel/bin/python -m unittest discover -s tests -v

      - name: Install and test source distribution
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python -m pip check
          QT_QPA_PLATFORM=offscreen .release-sdist/bin/python -m unittest discover -s tests -v

      - name: Create checksums
        run: sha256sum dist/*.tar.gz dist/*.whl > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi

  flatpak:
    name: Build Flatpak
    needs: package
    permissions:
      contents: write
    uses: ./.github/workflows/build-flatpak.yml
    with:
      tag: ${{ github.ref_name }}

  homebrew:
    name: Update Homebrew
    needs: package
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
