name: Build Windows release

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag used to name artifacts
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  executable:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and build tools
        run: python -m pip install ".[iroh]" "pyinstaller>=6.14,<7"

      - name: Read release version
        id: release
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:TAG -and $env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match package version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build standalone executable
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name "Pomodorough-$env:VERSION-windows-x86_64" `
            --collect-data pomodorough `
            --hidden-import pomodorough.shared_core `
            --collect-all wasmtime `
            deploy/windows/launcher.py

      - name: Smoke test executable
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $executable = "dist/Pomodorough-$env:VERSION-windows-x86_64.exe"
          $env:POMODOROUGH_SHARED_CORE_SMOKE = "1"
          $coreProcess = Start-Process -FilePath $executable -PassThru -Wait
          Remove-Item Env:POMODOROUGH_SHARED_CORE_SMOKE
          if ($coreProcess.ExitCode -ne 0) {
            throw "Packaged shared-core smoke test failed"
          }
          $env:POMODOROUGH_SCREENSHOT = "$PWD/dist/smoke.png"
          $process = Start-Process -FilePath $executable -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged application did not exit after smoke test"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $env:POMODOROUGH_SCREENSHOT)) {
            throw "Packaged application smoke test failed"
          }
          Remove-Item $env:POMODOROUGH_SCREENSHOT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist/Pomodorough-${{ steps.release.outputs.version }}-windows-x86_64.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 7
