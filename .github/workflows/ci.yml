name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_COMMIT: "440f5364f036d02d46abca048f09b893b0134791"
  CORE_RELEASE_TAG: "v0.7.0"
  CORE_SHA256: "4a58bd2b702e0d43d6f2262d21f7e940dfdf05cc911d6519b67c1b5e988d8b0b"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install package
        run: python -m pip install .

      - name: Import application entry points
        run: python -c "import pomodorough.app, pomodorough.cli, pomodorough.tui"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Test optional Iroh runtime
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install ".[iroh]"
          python -c "import iroh; assert len(iroh.SecretKey.generate().to_bytes()) == 32"
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_iroh_network -v

  quality:
    name: Static checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: pomodorough-core-source
          persist-credentials: false

      - name: Verify pinned source and released shared core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pomodorough-core-source rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd pomodorough-core-source
            cargo +1.97.1 test --all-targets --locked
            cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          )
          rebuilt=pomodorough-core-source/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$rebuilt"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            src/pomodorough/resources/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          released="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --silent --show-error --location \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$released"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$released" \
            --sha256 "$CORE_SHA256"
          cmp "$released" src/pomodorough/resources/pomodorough_core.wasm
          grep -Fx "$CORE_COMMIT" src/pomodorough/resources/CORE_COMMIT
          grep -Fx "$CORE_SHA256  pomodorough_core.wasm" \
            src/pomodorough/resources/pomodorough_core.wasm.sha256

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check documentation and resource contracts
        run: |
          python scripts/check_docs.py
          python scripts/check_protocol_fixture.py
          python scripts/check_workflow_pins.py
          python scripts/check_localization.py

      - name: Lint Python sources
        run: ruff check .

      - name: Check canonical dependency contracts
        run: >-
          npx --yes pyright@1.1.413 --pythonversion 3.12
          src/pomodorough/storage_canonical.py
          src/pomodorough/storage_canonical_acknowledgements.py
          src/pomodorough/storage_canonical_reconciliation.py
          src/pomodorough/storage_canonical_installation.py
          tests/typecheck_canonical_dependencies.py

      - name: Reject invalid canonical type contracts
        shell: bash
        run: |
          check_negative() {
            fixture=$1
            diagnostic=$2
            output=$(mktemp)
            if npx --yes pyright@1.1.413 --pythonversion 3.12 "$fixture" >"$output" 2>&1; then
              echo "Pyright unexpectedly accepted $fixture" >&2
              exit 1
            fi
            grep -Fq "$diagnostic" "$output"
          }
          check_negative \
            tests/typecheck_canonical_invalid_project_keyword.py \
            reportCallIssue
          check_negative \
            tests/typecheck_canonical_invalid_duration_callback.py \
            reportArgumentType

      - name: Check shell syntax
        run: >-
          sh -n deploy/install.sh scripts/unpack_release_artifacts.sh
          scripts/verify_release_artifacts.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
