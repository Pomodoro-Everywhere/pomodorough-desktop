name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install package
        run: python -m pip install .

      - name: Import application entry points
        run: python -c "import pomodorough.app, pomodorough.cli, pomodorough.tui"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Test optional Iroh runtime
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install ".[iroh]"
          python -c "import iroh; assert len(iroh.SecretKey.generate().to_bytes()) == 32"
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_iroh_network -v

  quality:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check documentation and resource contracts
        run: |
          python scripts/check_docs.py
          python scripts/check_protocol_fixture.py
          python scripts/check_workflow_pins.py
          python scripts/check_localization.py

      - name: Lint Python sources
        run: ruff check .

      - name: Check shell syntax
        run: sh -n deploy/install.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
