name: CI
run-name: candidate-${{ inputs.candidate-request || github.run_id }}

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      candidate-request:
        description: Unique hosted candidate execution request
        required: true
        type: string
      expected-sha:
        description: Exact candidate source commit; fail if dispatch branch moved
        required: true
        type: string
      command-sha256:
        description: SHA256 of the invoking candidate adapter argument array
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate-request || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_COMMIT: "fde2eaf42c39cd175e23796b9037999abadef732"
  CORE_RELEASE_TAG: "v0.11.0"
  CORE_SHA256: "162954f2c68dc3f90b663483b7df327d583d97f64d1391b60105febe2383896a"

jobs:
  candidate-source:
    name: Validate candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check candidate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          inputs = json.loads(os.environ["CANDIDATE_INPUTS"])
          assert re.fullmatch(r"[0-9a-f]{32}", inputs["candidate-request"])
          assert re.fullmatch(r"[0-9a-f]{40}", inputs["expected-sha"])
          assert re.fullmatch(r"[0-9a-f]{64}", inputs["command-sha256"])
          assert inputs["expected-sha"] == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          assert os.environ["RUNNER_ENVIRONMENT"] == "github-hosted"
          context = {
              "inputs": inputs,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_environment": os.environ["RUNNER_ENVIRONMENT"],
          }
          with open("candidate-context.json", "w") as output:
              json.dump(context, output, sort_keys=True)
          PY

      - name: Retain candidate dispatch context
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-context-${{ inputs.candidate-request }}
          path: candidate-context.json
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: candidate-source
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checked out source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install package and test runner
        run: |
          python -m pip install . pytest==9.1.1
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.5

      - name: Import application entry points
        run: python -c "import pomodorough.app, pomodorough.cli, pomodorough.tui"

      - name: Smoke installed macOS package
        if: runner.os == 'macOS'
        run: |
          python -m pip check
          python -c 'from importlib.metadata import distribution; from inspect import signature; expected = {"pomodorough": "pomodorough.app:main", "pomodorough-cli": "pomodorough.cli:main", "pomodorough-tui": "pomodorough.tui:main"}; entries = {entry.name: entry for entry in distribution("pomodorough-linux").entry_points if entry.group == "console_scripts"}; assert set(entries) == set(expected); assert all(entries[name].value == target for name, target in expected.items()); loaded = {name: entries[name].load() for name in expected}; assert all(callable(target) and signature(target).bind() is not None for target in loaded.values())'
          python -c 'import os; from contextlib import ExitStack; from importlib.metadata import distribution; from unittest.mock import patch; entry = next(entry for entry in distribution("pomodorough-linux").entry_points if entry.group == "console_scripts" and entry.name == "pomodorough"); target = entry.load(); stack = ExitStack(); application = stack.enter_context(patch("pomodorough.app.QApplication")); stack.enter_context(patch("pomodorough.app.QIcon")); lock = stack.enter_context(patch("pomodorough.app._instance_lock")); stack.enter_context(patch("pomodorough.app.Store")); stack.enter_context(patch("pomodorough.app.CloudService")); stack.enter_context(patch("pomodorough.app._iroh_service")); stack.enter_context(patch("pomodorough.app.MainWindow")); stack.enter_context(patch("pomodorough.app.QTimer")); stack.enter_context(patch("pomodorough.app.signal.signal")); os.environ.pop("POMODOROUGH_SCREENSHOT", None); lock.return_value.tryLock.return_value = True; application.return_value.exec.return_value = 0; assert target() == 0; application.return_value.exec.assert_called_once_with(); stack.close()'
          pomodorough-cli --help
          pomodorough-tui --help

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --frozen --with pytest==9.1.1 python -m pytest tests -v --junitxml=pytest-results.xml

      - name: Retain full pytest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Test optional Iroh runtime
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install ".[iroh]"
          python -c "import iroh; assert len(iroh.SecretKey.generate().to_bytes()) == 32"
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_iroh_network -v

      - name: Test optional Iroh runtime on macOS
        if: runner.os == 'macOS'
        run: |
          python -m pip install ".[iroh]"
          python -c "import iroh; assert len(iroh.SecretKey.generate().to_bytes()) == 32"
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_iroh_network -v

  quality:
    needs: candidate-source
    name: Static checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify checked out source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: pomodorough-core-source
          persist-credentials: false

      - name: Verify pinned source and released shared core
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pomodorough-core-source rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd pomodorough-core-source
            cargo +1.97.1 test --all-targets --locked
            cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          )
          rebuilt=pomodorough-core-source/target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$rebuilt"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            src/pomodorough/resources/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          released="$RUNNER_TEMP/pomodorough_core.wasm"
          curl --fail --silent --show-error --location \
            "https://github.com/Pomodoro-Everywhere/pomodorough-core/releases/download/$CORE_RELEASE_TAG/pomodorough_core.wasm" \
            --output "$released"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$released" \
            --sha256 "$CORE_SHA256"
          cmp "$released" src/pomodorough/resources/pomodorough_core.wasm
          grep -Fx "$CORE_COMMIT" src/pomodorough/resources/CORE_COMMIT
          grep -Fx "$CORE_SHA256  pomodorough_core.wasm" \
            src/pomodorough/resources/pomodorough_core.wasm.sha256

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check documentation and resource contracts
        run: |
          python scripts/check_docs.py
          python scripts/check_protocol_fixture.py
          python scripts/check_workflow_pins.py
          python scripts/check_localization.py

      - name: Lint Python sources
        run: ruff check .

      - name: Check canonical dependency contracts
        run: >-
          npx --yes pyright@1.1.413 --pythonversion 3.12
          src/pomodorough/storage_canonical.py
          src/pomodorough/storage_canonical_acknowledgements.py
          src/pomodorough/storage_canonical_reconciliation.py
          src/pomodorough/storage_canonical_installation.py
          tests/typecheck_canonical_dependencies.py

      - name: Reject invalid canonical type contracts
        shell: bash
        run: |
          check_negative() {
            fixture=$1
            diagnostic=$2
            output=$(mktemp)
            if npx --yes pyright@1.1.413 --pythonversion 3.12 "$fixture" >"$output" 2>&1; then
              echo "Pyright unexpectedly accepted $fixture" >&2
              exit 1
            fi
            grep -Fq "$diagnostic" "$output"
          }
          check_negative \
            tests/typecheck_canonical_invalid_project_keyword.py \
            reportCallIssue
          check_negative \
            tests/typecheck_canonical_invalid_duration_callback.py \
            reportArgumentType

      - name: Check shell syntax
        run: >-
          sh -n deploy/install.sh scripts/unpack_release_artifacts.sh
          scripts/verify_release_artifacts.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
