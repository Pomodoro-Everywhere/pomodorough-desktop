name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_COMMIT: "8dc24486b38d87eb2c717e80b4315b31dd6a671d"
  CORE_SHA256: "1e67043a8a652c5f9c6d36b28fe280b4bb5677e0c0279faaccdceb407181face"
  CORE_RELEASE: "v0.1.5"

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install package
        run: python -m pip install .

      - name: Import application entry points
        run: python -c "import pomodorough.app, pomodorough.cli, pomodorough.tui"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Test optional Iroh runtime
        if: runner.os == 'Linux' || runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install ".[iroh]"
          python -c "import iroh; assert len(iroh.SecretKey.generate().to_bytes()) == 32"
          QT_QPA_PLATFORM=offscreen python -m unittest tests.test_iroh_network -v

  quality:
    name: Static checks
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned shared core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Pomodoro-Everywhere/pomodorough-core
          ref: ${{ env.CORE_COMMIT }}
          path: pomodorough-core-source
          persist-credentials: false

      - name: Test pinned core and verify canonical release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pomodorough-core-source rev-parse HEAD)" = "$CORE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
          (
            cd pomodorough-core-source
            cargo +1.97.1 test --all-targets --locked
          )
          git -C pomodorough-core-source fetch --depth=1 origin \
            "refs/tags/$CORE_RELEASE:refs/tags/$CORE_RELEASE"
          test "$(git -C pomodorough-core-source rev-list -n 1 "$CORE_RELEASE")" = "$CORE_COMMIT"
          published_dir="$RUNNER_TEMP/published-shared-core"
          mkdir -p "$published_dir"
          gh release download "$CORE_RELEASE" \
            --repo Pomodoro-Everywhere/pomodorough-core \
            --pattern pomodorough_core.wasm \
            --dir "$published_dir"
          published="$published_dir/pomodorough_core.wasm"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            "$published" \
            --sha256 "$CORE_SHA256"
          python3 pomodorough-core-source/scripts/verify_wasm_artifact.py \
            src/pomodorough/resources/pomodorough_core.wasm \
            --sha256 "$CORE_SHA256"
          python3 scripts/verify_shared_core_provenance.py \
            --sha256 "$CORE_SHA256" \
            "$published" \
            src/pomodorough/resources/pomodorough_core.wasm
          grep -Fx "$CORE_COMMIT" src/pomodorough/resources/CORE_COMMIT
          grep -Fx "$CORE_SHA256  pomodorough_core.wasm" \
            src/pomodorough/resources/pomodorough_core.wasm.sha256

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff==0.15.22

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Check documentation and resource contracts
        run: |
          python scripts/check_docs.py
          python scripts/check_protocol_fixture.py
          python scripts/check_workflow_pins.py
          python scripts/check_localization.py

      - name: Lint Python sources
        run: ruff check .

      - name: Check shell syntax
        run: >-
          sh -n deploy/install.sh scripts/unpack_release_artifacts.sh
          scripts/verify_release_artifacts.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
